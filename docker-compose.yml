services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD"
          /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -C -l 5 -b -Q "SET NOCOUNT ON; SELECT 1"
          >/dev/null
      interval: 10s
      timeout: 8s
      retries: 15
      start_period: 45s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    entrypoint: [/opt/mssql-tools18/bin/sqlcmd, -S, sqlserver, -U, sa, -C, -b, -i, /init.sql]
    volumes:
      - ./TaskChecklist/Data/sqlserver-init.sql:/init.sql:ro

volumes:
  mssql_data:
